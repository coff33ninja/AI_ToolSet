[project]
name = "ai-toolset"
version = "0.1.0"
description = "GPU-accelerated ML toolkit for Windows: project-local CUDA/cuDNN provisioning, YOLO detection & training, OCR, STT/TTS voice cloning, screen capture, video frame and dataset tools."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { file = "LICENSE" }
keywords = [
    "machine-learning",
    "cuda",
    "tensorflow",
    "pytorch",
    "yolo",
    "object-detection",
    "ocr",
    "speech-to-text",
    "text-to-speech",
    "voice-cloning",
    "rvc",
    "mediapipe",
    "computer-vision",
    "gpu",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
urls = { Repository = "https://github.com/coff33ninja/AI_ToolSet" }
dependencies = [
    "numpy==1.23.5",
    "tensorflow==2.10",
    "keras==2.10",
    "opencv-python",
    "Pillow",
    "mss",
    "pyautogui",
    "pyzmq",
    "python-dotenv",
]

[project.optional-dependencies]
# Voice cloning / TTS base stack (RVC, XTTS v2, so-vits-svc). torch +
# torchaudio resolve from the official PyTorch CUDA 11.8 wheel index via
# [tool.uv.sources] below - nothing is installed system-wide, everything
# lives in .venv. Install with: uv sync --extra voice
voice = [
    "torch",
    "torchaudio",
    "librosa<0.11",
    "soundfile",
]

# Speech-to-text: OpenAI Whisper (PyTorch, uses the cu118 torch from the voice
# extra) + faster-whisper (CTranslate2). ctranslate2's official PyPI wheels
# bundle GPU support AND cuDNN 9 (cudnn64_9.dll sits inside the wheel), so the
# only missing runtime pieces for GPU on Windows are the CUDA 12 cuBLAS +
# cudart DLLs. Those come from NVIDIA's own redistributable wheels
# (nvidia-cublas-cu12, nvidia-cuda-runtime-cu12) installed into .venv by uv -
# sitecustomize.py puts their site-packages/nvidia/*/bin (or lib) dirs on PATH
# at interpreter startup. Nothing is installed system-wide. CPU works out of
# the box. Install with: uv sync --extra stt
stt = [
    "openai-whisper==20250625",
    "faster-whisper",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cuda-runtime-cu12==12.9.79",
]

# Vision: YOLO detection + training (ultralytics). torchvision must resolve
# from the same CUDA 11.8 wheel index as torch (see [tool.uv.sources]).
# Install with: uv sync --extra voice --extra vision
vision = [
    "ultralytics",
    "torchvision",
]

# Audio capture for voice cloning / live transcription (sounddevice wraps
# PortAudio via its own wheels - no system installs).
# Install with: uv sync --extra audio
audio = [
    "sounddevice",
]

# OCR via Windows.Media.Ocr (no model downloads, no torch).
# Install with: uv sync --extra ocr
ocr = [
    "winocr",
]

# RVC voice conversion. rvc-python pins numpy<=1.23.5 which matches this
# project's TF-pinned numpy; it pulls fairseq/hydra for the HuBERT encoder.
# fairseq is listed here (not just via rvc-python) so the [tool.uv.sources]
# path mapping applies - uv only honors sources for direct dependencies.
# Install with: uv sync --extra rvc
rvc = [
    "rvc-python",
    "fairseq==0.12.2",
]

# Speaker diarization. Heavy graph (speechbrain, onnxruntime,
# pytorch-lightning); the model is gated and needs a Hugging Face token.
# Install with: uv sync --extra diarize
diarize = [
    "pyannote.audio>=3.0",
]

# Text-to-speech: Coqui XTTS v2 voice cloning (uses the torch already pulled
# by the voice extra). 0.24.3 is the newest release with a prebuilt
# cp310-win_amd64 wheel - newer versions are sdist-only and their C extension
# needs an MSVC dev shell, which conflicts with uv's isolated builds.
# click: spacy (pulled by coqui-tts) imports it directly, but its typer dep
# resolves to typer-slim which deliberately omits click.
# Install with: uv sync --extra tts
tts = [
    "coqui-tts==0.24.3",
    "click",
]

# MediaPipe: face/hands/pose/holistic landmarks + selfie segmentation on
# webcam frames. 0.10.9 pinned (last cp310-win wheel whose `solutions` API is
# bundled AND whose protobuf<4,>=3.11 constraint fits TF 2.10's protobuf
# 3.19.6 pin - 0.10.14+ needs protobuf>=4.25, which TF 2.10 cannot run with).
# opencv-contrib-python is unpinned in its metadata, so the shared
# opencv-python==4.10.0.84 override keeps both cv2 providers identical.
# Install with: uv sync --extra mediapipe
mediapipe = [
    "mediapipe==0.10.9",
]

# Web dashboard: FastAPI + uvicorn serving the ai_toolset webapp (OCR,
# detection, STT/TTS, benchmark, MediaPipe webcam stream).
# Install with: uv sync --extra web
web = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]

# Streamlit quick-UI for STT/TTS/detection demos. Separate extra so its
# heavier graph (pandas/pyarrow/altair) can never break the FastAPI dashboard.
# Install with: uv sync --extra ui
ui = [
    "streamlit",
]

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_toolset*"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Vendored fairseq is third-party code (and would throw thousands of lint
# errors); examples/scratch_*.py are throwaway demos.
extend-exclude = ["vendor", "examples/scratch_*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # function call in default argument (FastAPI Depends)

[tool.pytest.ini_options]
testpaths = ["tests"]
# hydra (pulled in by the rvc extra's fairseq) ships a pytest11 plugin that
# needs antlr4; disable it so the full local env can run the suite too.
addopts = "-p no:hydra_pytest -m 'not slow'"
markers = [
    "gpu: requires a CUDA GPU",
    "slow: downloads model weights or takes minutes",
]

[tool.uv]
  # Cache project-locally on the workspace drive (E:) instead of the default
  # %LOCALAPPDATA%\uv\cache on the system drive. The target drive is a
  # different filesystem, so cross-drive hardlinks are impossible - copy mode
  # is what uv falls back to anyway and silences the warning.
  cache-dir = ".uv-cache"
  link-mode = "copy"

  # rvc (fairseq -> hydra-core<1.1 -> omegaconf<2.1) and diarize (pyannote
  # stack -> omegaconf>=2.1) are fundamentally incompatible in one
  # environment. Declaring them conflicting lets each extra resolve and
  # install standalone: uv sync --extra rvc  OR  uv sync --extra diarize.
  conflicts = [
    [{ extra = "rvc" }, { extra = "diarize" }],
  ]


# This toolkit targets Windows only (TensorFlow 2.10 native-Windows GPU). Pin
# resolution to win32 so Linux/macOS marker splits never try to satisfy
# platform-specific conflicts (e.g. coqui-tts-trainer's tensorboard>=2.17 vs
# TF 2.10's tensorboard<2.11) that cannot occur in the real environment.
environments = ["sys_platform == 'win32'"]

# TensorFlow 2.10 requires numpy<1.24 (numpy 1.24 removed aliases TF 2.10
# uses). coqui-tts declares numpy>=1.24.3 in its metadata but runs fine on
# numpy 1.23.5, so we force numpy for the whole graph - the single
# environment must satisfy TF 2.10, torch 2.7 cu118, and TTS at once.
#
# tensorflow-io-gcs-filesystem is a transitive dep of TF 2.10 that stopped
# shipping Windows wheels after 0.31.0; pin it so resolution stays on the
# last version that works on win_amd64.
#
# coqui-tts-trainer (a training-only dep of coqui-tts, never imported for
# inference) wants tensorboard>=2.17, but TF 2.10 pins tensorboard<2.11.
# TF 2.10's own tensorboard satisfies the inference path, so force it.
#
# numba 0.58+ requires numpy>=1.24 (librosa pulls the latest numba), but the
# graph is forced to numpy 1.23.5 for TF 2.10. 0.57.1 is the last numba that
# supports numpy 1.23.
#
# coqui-tts 0.24.x imports transformers.LogitsWarper (XTTS/autoregressive),
# which transformers 5.x removed - the resolver would otherwise pull the
# latest. 4.40.2 is the version the coqui-tts release was built against.
#
# mediapipe 0.10.14 requires opencv-contrib-python==4.10.0.84. Two providers in
# one env means their cv2 packages share files on disk (uv's per-package RECORD
# then misattributes cv2.pyd and a sync can delete it). Pin BOTH opencv-python
# and opencv-contrib-python to the identical 4.10.0.84 wheel so the on-disk cv2
# is the same superset no matter which one lands last - matching the 4.10 line
# the vision/OCR stacks were verified against.
# mediapipe 0.10.9 needs protobuf 3.20.x: its generated _pb2.py still does
# `from google.protobuf.internal import builder`, and 3.20.3 is the only
# wheel that ships builder.py (removed in 3.21/4.x; 3.19 and older never
# packaged it). TF 2.10 declares <3.20 but runs fine on 3.20.3; streamlit
# 1.22 declares >=3.20 so it is actually satisfied here. Do not bump to 4.x
# while the mediapipe extra is in the profile (TF 2.10 would break).
override-dependencies = [
    "numpy==1.23.5",
    "protobuf==3.20.3",
    "tensorflow-io-gcs-filesystem==0.31.0",
    "tensorboard==2.10.1",
    "numba==0.57.1",
    "transformers==4.40.2",
    "opencv-python==4.10.0.84",
    "opencv-contrib-python==4.10.0.84",
]

[[tool.uv.index]]
# PyTorch CUDA 11.8 wheels bundle CUDA/cuDNN inside the wheel (torch/lib) -
# no system CUDA toolkit, no DLL downloads, just a recent NVIDIA driver.
# explicit = true keeps this index from contaminating normal package resolution.
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
# Vendored + patched: stock fairseq 0.12.2 builds C/Cython extensions that
# fail without the Windows SDK. The patch drops them - RVC inference only
# needs the pure-Python HuBERT path (see vendor/fairseq-0.12.2/setup.py).
fairseq = { path = "vendor/fairseq-0.12.2" }
