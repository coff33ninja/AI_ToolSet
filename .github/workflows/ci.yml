name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install
        run: uv sync --group dev --no-progress
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (pytest)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install (ui, ocr, web, audio, mediapipe)
        run: >-
          uv sync --group dev --no-progress
          --extra ui --extra ocr --extra web --extra audio --extra mediapipe
      - name: Test
        run: uv run pytest -v
